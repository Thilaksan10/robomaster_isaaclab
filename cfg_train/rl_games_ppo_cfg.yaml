  load_checkpoint: False
  load_path: nn/Robomaster.pth

  config:
    name: 'Robomaster'
    env_name : rlgpu
    device: cuda
    device_id: 0
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    reward_shaper:
      scale_value: 0.1
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 3e-4
    lr_schedule: adaptive
    kl_threshold: 0.008
    score_to_win: 100000
    max_epochs: 50000
    save_best_after: 25
    save_frequency: 500
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 32768  
    # minibatch_size: 16384
    # minibatch_size: 32
    mini_epochs: 4
    critic_coef: 4
    clip_value: True
    seq_length: 8
    bounds_loss_coef: 0.0001

