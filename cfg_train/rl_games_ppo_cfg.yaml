    name: mlp_net
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      # units: [4096, 2048, 1024]
      # units: [2048, 1024, 512]
      units: [512, 256, 128]  
      # units: [256, 128, 64]     
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

